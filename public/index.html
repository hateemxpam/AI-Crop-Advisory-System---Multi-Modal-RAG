<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Crop Advisory</title>
  <style>
    :root {
      --bg: #f5f7f3;
      --card: #ffffff;
      --ink: #1f2a1f;
      --muted: #5c6b5c;
      --brand: #2f7d32;
      --brand-2: #1b5e20;
      --border: #d9e2d4;
      --danger: #b3261e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 10% 10%, #eaf3e4 0%, var(--bg) 55%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .card {
      width: min(860px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 12px 28px rgba(24, 44, 24, 0.08);
      overflow: hidden;
    }

    .head {
      padding: 20px;
      background: linear-gradient(135deg, #2f7d32 0%, #4caf50 100%);
      color: #fff;
    }

    .head h1 {
      margin: 0;
      font-size: 1.4rem;
    }

    .head p {
      margin: 8px 0 0;
      opacity: 0.95;
      font-size: 0.95rem;
    }

    .body {
      padding: 20px;
      display: grid;
      gap: 14px;
    }

    .row {
      display: grid;
      gap: 8px;
    }

    label {
      font-weight: 600;
      font-size: 0.95rem;
    }

    textarea, select, button {
      font: inherit;
    }

    textarea, select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      background: #fff;
      color: var(--ink);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 600;
    }

    #askBtn {
      background: var(--brand);
      color: #fff;
    }

    #askBtn:hover { background: var(--brand-2); }

    #clearBtn {
      background: #edf3ea;
      color: #243424;
    }

    .status {
      min-height: 20px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .status.error { color: var(--danger); }

    .answer {
      white-space: pre-wrap;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fcfefb;
      padding: 14px;
      min-height: 130px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="card">
    <section class="head">
      <h1>AI Crop Advisory</h1>
      <p>Ask your crop question and get a practical answer from the RAG pipeline.</p>
    </section>

    <section class="body">
      <div class="row">
        <label for="query">Your Question</label>
        <textarea id="query" placeholder="Example: What should I do for wheat rust disease?"></textarea>
      </div>

      <div class="row">
        <label for="language">Language</label>
        <select id="language">
          <option value="en">English</option>
          <option value="ur">Urdu</option>
          <option value="pa">Punjabi</option>
        </select>
      </div>

      <div class="actions">
        <button id="askBtn" type="button">Get Advisory</button>
        <button id="clearBtn" type="button">Clear</button>
      </div>

      <div id="status" class="status"></div>

      <div class="row">
        <label for="answer">Response</label>
        <div id="answer" class="answer">Your advisory response will appear here.</div>
      </div>
    </section>
  </main>

  <script>
    const queryEl = document.getElementById("query");
    const languageEl = document.getElementById("language");
    const askBtn = document.getElementById("askBtn");
    const clearBtn = document.getElementById("clearBtn");
    const statusEl = document.getElementById("status");
    const answerEl = document.getElementById("answer");

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.classList.toggle("error", isError);
    }

    async function askQuestion() {
      const query = queryEl.value.trim();
      const language = languageEl.value;

      if (!query) {
        setStatus("Please enter a question.", true);
        return;
      }

      askBtn.disabled = true;
      setStatus("Getting response...");
      answerEl.textContent = "";

      try {
        const response = await fetch("/api/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, language }),
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          const errorMsg = data?.error || "Request failed.";
          setStatus(errorMsg, true);
          answerEl.textContent = "No response available.";
          return;
        }

        answerEl.textContent = data?.data?.response || "No response available.";
        setStatus("Done.");
      } catch (error) {
        setStatus("Could not connect to server. Make sure backend is running.", true);
        answerEl.textContent = "No response available.";
      } finally {
        askBtn.disabled = false;
      }
    }

    askBtn.addEventListener("click", askQuestion);

    clearBtn.addEventListener("click", () => {
      queryEl.value = "";
      answerEl.textContent = "Your advisory response will appear here.";
      setStatus("");
      queryEl.focus();
    });
  </script>
</body>
</html>
